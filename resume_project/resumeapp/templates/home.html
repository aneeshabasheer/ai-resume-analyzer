{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="hero-container">
    <div class="container">
        <div class="row align-items-center">
            <!-- Left Side: Header & Text -->
            <div class="col-lg-6 mb-5 mb-lg-0 text-center text-lg-start">
                <h1 class="hero-title mb-4">AI Resume Analyzer</h1>
                <p class="hero-subtitle mb-5 mx-auto mx-lg-0">
                    Upload your resume and get best job matches instantly using AI.
                </p>
                <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start">
                    {% if user.is_authenticated %}
                        <a href="{% url 'dashboard' %}" class="btn btn-pill-primary">Go to Dashboard <i class="fa-solid fa-arrow-right ms-2"></i></a>
                    {% else %}
                        <a href="{% url 'register' %}" class="btn btn-pill-primary">Get Started</a>
                    {% endif %}
                </div>
            </div>
            
            <!-- Right Side: Graphic Illustration (Screen 1) -->
            <div class="col-lg-6 text-center">
                <div class="position-relative d-inline-block">
                    <!-- High-fidelity AI generated illustration with dynamic fallback -->
                    <div class="illustration-card" id="home-illustration-card">
                        <!-- Loaded static image asset -->
                        <img id="ai-illustration" src="{% static 'images/home_illustration.jpg' %}" alt="AI Parsing Illustration" class="img-fluid rounded-4 shadow-sm" style="max-width: 440px; object-fit: cover;" onerror="handleImageError(this)">
                        
                        <!-- Premium Dynamic CSS & Icon Graphic Fallback (displayed if image fails to load) -->
                        <div id="fallback-illustration" style="display: none; width: 420px; height: 380px;" class="py-4">
                            <div class="position-relative d-inline-block">
                                <i class="fa-solid fa-file-invoice text-primary" style="font-size: 13rem; filter: drop-shadow(0 15px 35px rgba(37, 99, 235, 0.25));"></i>
                                <div class="position-absolute bg-white rounded-circle shadow-lg d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; top: -10px; right: -20px; border: 1px solid rgba(0,0,0,0.05);">
                                    <i class="fa-solid fa-magnifying-glass text-primary fs-3"></i>
                                </div>
                                <div class="position-absolute bg-success text-white px-3 py-2 rounded-pill shadow-lg d-flex align-items-center gap-2" style="bottom: 30px; right: -30px;">
                                    <i class="fa-solid fa-circle-check"></i>
                                    <span class="fw-bold small">Score: 92%</span>
                                </div>
                                <div class="position-absolute bg-warning text-dark px-3 py-2 rounded-pill shadow-lg d-flex align-items-center gap-2" style="top: 30px; left: -40px;">
                                    <i class="fa-solid fa-robot"></i>
                                    <span class="fw-bold small">AI Analyzer</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function handleImageError(imgElement) {
        imgElement.style.display = 'none';
        document.getElementById('fallback-illustration').style.display = 'block';
    }
</script>
{% endblock %}
